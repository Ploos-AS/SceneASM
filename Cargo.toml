[workspace]
resolver = "2"
members = [
    "crates/sceneasm-core",
    "crates/sceneasm-cli",
    "crates/sceneasm-lsp",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Ploos-AS/SceneASM"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
